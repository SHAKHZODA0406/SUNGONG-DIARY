name: Build Android app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: App icon and splash
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#102F66' --iconBackgroundColorDark '#102F66' --splashBackgroundColor '#102F66' --splashBackgroundColorDark '#102F66'

      - name: Notification icon, permissions, version
        run: node scripts/patch-android.js

      - name: Copy app files
        run: npx cap sync android

      - name: Use the fixed signing key (so updates install over the old version)
        run: mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Publish download link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SunGong-Diary.apk
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" SunGong-Diary.apk \
            --title "순공 다이어리 $TAG" \
            --notes "Telefon va planshetda shu sahifani oching → SunGong-Diary.apk ni bosib yuklab oling → o'rnating." \
            --latest
